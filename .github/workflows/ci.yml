name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Public runners have 16 GB; the client's two big crates link better with fewer jobs.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check the workspace (all targets)
        run: cargo check --workspace --all-targets

      - name: Check without default features
        run: cargo check -p horizon-client --no-default-features

      - name: Client library tests
        run: cargo test -p horizon-client --lib
